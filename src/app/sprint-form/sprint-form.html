<div class="min-h-full bg-slate-50 text-slate-900">
  <div class="mx-auto max-w-2xl px-4 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-800">
        {{ isEditMode() ? 'Edit sprint' : 'New sprint' }}
      </h1>
      <p class="mt-1 text-slate-500">
        @if (isEditMode()) {
          Update sprint details.
        } @else {
          Create a sprint for <span class="font-medium text-slate-700">{{ projectLabel() }}</span>.
        }
      </p>
    </header>

    <form [formGroup]="sprintForm" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="sprint-title" class="mb-1 block text-sm font-medium text-slate-700">
          Sprint title
        </label>
        <input
          id="sprint-title"
          type="text"
          formControlName="title"
          placeholder="e.g. Sprint 1"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 placeholder-slate-400 shadow-sm transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
          autofocus
        />
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label for="sprint-start" class="mb-1 block text-sm font-medium text-slate-700">
            Start date <span class="text-slate-400">(Shamsi)</span>
          </label>
          <app-persian-date-input
            formControlName="startDate"
            inputId="sprint-start"
            placeholder="انتخاب تاریخ شروع"
          />
        </div>
        <div>
          <label for="sprint-end" class="mb-1 block text-sm font-medium text-slate-700">
            End date <span class="text-slate-400">(Shamsi)</span>
          </label>
          <app-persian-date-input
            formControlName="endDate"
            inputId="sprint-end"
            placeholder="انتخاب تاریخ پایان"
          />
        </div>
      </div>

      @if (error) {
        <p class="text-sm text-red-600">{{ error }}</p>
      }

      <div class="flex flex-wrap gap-3">
        <button
          type="submit"
          class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          {{ isEditMode() ? 'Save changes' : 'Create sprint' }}
        </button>
        <a
          [routerLink]="backLink()"
          class="rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          Cancel
        </a>
        @if (isEditMode()) {
          <button
            type="button"
            (click)="deleteSprint()"
            class="rounded-xl border border-red-200 bg-white px-5 py-2.5 text-sm font-medium text-red-600 shadow-sm transition hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
          >
            Delete sprint
          </button>
        }
      </div>
    </form>
  </div>
</div>
